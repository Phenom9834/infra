---
all:
  vars:
    cluster_name: "oorucluster"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "v1.2.1.0"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: false
    rancher_import_url: 
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        oorucluster-CONTROL-PLANE-NODE-1:
          ansible_host: 10.0.4.152
          node_role: control_plane
          is_primary: true
          node_index: 0
        oorucluster-CONTROL-PLANE-NODE-2:
          ansible_host: 10.0.4.254
          node_role: control_plane
          is_primary: false
          node_index: 1
        oorucluster-CONTROL-PLANE-NODE-3:
          ansible_host: 10.0.4.144
          node_role: control_plane
          is_primary: false
          node_index: 2
    
    etcd:
      hosts:
        oorucluster-ETCD-NODE-1:
          ansible_host: 10.0.4.55
          node_role: etcd
        oorucluster-ETCD-NODE-2:
          ansible_host: 10.0.4.98
          node_role: etcd
        oorucluster-ETCD-NODE-3:
          ansible_host: 10.0.4.215
          node_role: etcd
    
    workers:
      hosts:
        oorucluster-WORKER-NODE-1:
          ansible_host: 10.0.4.234
          node_role: worker
        oorucluster-WORKER-NODE-2:
          ansible_host: 10.0.4.100
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
